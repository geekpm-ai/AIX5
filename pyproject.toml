[project]
name = "aix5-ai"
version = "0.1.0"
description = "RDK X5 local AI video analyzer"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "psutil>=6,<7",
  "argon2-cffi>=23,<26",
  "cryptography>=44,<51",
  "onvif-zeep>=0.2.12,<1",
  "aiortc>=1.15,<2",
  "numpy>=1.23,<3",
  "scipy>=1.9,<2",
  "opencv-python-headless>=4.6,<5",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
[project.scripts]
aix5-ai = "aix5_ai.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aix5_ai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
